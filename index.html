<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Mobile Hisab by Z Mobile</title>
<meta name="application-name" content="Mobile Hisab">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<link rel="manifest" href="manifest.json?v=25">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mobile Hisab">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f1115;
    --surface:#171a21;
    --surface-2:#1f232c;
    --surface-3:#262b36;
    --border:#2a2f3a;
    --border-strong:#3a4150;
    --text:#e8eaed;
    --text-dim:#9aa0ab;
    --text-faint:#666d7a;
    --accent:#2dd4bf;
    --accent-text:#052e2b;
    --pta:#4ade80; --pta-bg:#132a1c;
    --nonpta:#fbbf24; --nonpta-bg:#2a2213;
    --cpid:#f87171; --cpid-bg:#2a1616;
    --jv:#60a5fa; --jv-bg:#131f2e;
    --bypass:#fb7185; --bypass-bg:#2a1420;
    --danger:#f87171;
    --sale:#c084fc;
    --radius:12px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;}
  button,input,select,textarea,a,.chip,.chip-opt,.settings-category,.settings-toggle-chip,.model-suggestion-chip{touch-action:manipulation;}
  button{-webkit-tap-highlight-color:transparent;}
  .app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px;overflow-x:hidden;}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 16px 12px;border-bottom:1px solid var(--border);}
  header h1{font-size:19px;font-weight:600;margin:0 0 12px;letter-spacing:-0.2px;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat{background:var(--surface);border-radius:var(--radius);padding:10px 8px;text-align:center;}
  .stat .v{font-size:16px;font-weight:600;}
  .stat .l{font-size:10.5px;color:var(--text-dim);margin-top:2px;}

  .search-row{display:flex;gap:8px;padding:12px 16px 0;}
  .search-row input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;}
  .search-row select{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 8px;color:var(--text);font-size:13px;max-width:130px;}
  .search-row input:focus,.search-row select:focus{outline:none;border-color:var(--accent);}

  .chips-scroll{display:flex;gap:6px;padding:10px 16px 4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .chips-scroll::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600;}

  .list{padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px;}
  .empty{text-align:center;color:var(--text-faint);padding:60px 20px;font-size:14px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .card.outofstock{opacity:0.55;}
  .card-title{font-size:15px;font-weight:600;}
  .card-sub{font-size:12px;color:var(--text-dim);margin-top:1px;}

  .card.group-card{padding:12px 14px 6px;}
  .piece-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .piece-row{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 11px;}
  .piece-row.outofstock{opacity:0.5;}
  .piece-row-top{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .piece-row-top.spec-badges{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);}
  .piece-row .sale-meta{margin-top:6px;}
  .piece-row .card-actions{margin-top:8px;}
  .badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .badges.spec-badges{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:600;}
  .badge.pta{background:var(--pta-bg);color:var(--pta);}
  .badge.nonpta{background:var(--nonpta-bg);color:var(--nonpta);}
  .badge.cpid{background:var(--cpid-bg);color:var(--cpid);}
  .badge.jv{background:var(--jv-bg);color:var(--jv);}
  .badge.bypass{background:var(--bypass-bg);color:var(--bypass);}
  .badge.sold-badge{background:var(--surface-3);color:var(--sale);}
  .badge.spec{background:var(--surface-3);color:var(--text-dim);}
  .badge.spec-issue{background:var(--nonpta-bg);color:var(--nonpta);font-size:12px;font-weight:700;padding:4px 10px;border:1px solid var(--nonpta);}
  .badge.qty{background:var(--surface-3);color:var(--text);}

  .price-row{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px;}
  .price-col{text-align:center;flex:1;}
  .price-col .l{font-size:10px;color:var(--text-faint);}
  .price-col .v{font-weight:600;margin-top:2px;}
  .price-col .v.profit-pos{color:var(--pta);}
  .price-col .v.profit-neg{color:var(--danger);}
  .price-col .v.dim{color:var(--text-faint);font-weight:400;}
  .sale-meta{font-size:12px;color:var(--text-dim);margin-top:6px;}
  .sell-range-prominent{
    margin-top:4px;
    padding:4px 0 2px;
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .sell-range-prominent .range-label{
    font-size:10px;
    color:var(--text-dim);
    font-weight:600;
    white-space:nowrap;
  }
  .sell-range-prominent .range-value{
    font-size:14px;
    line-height:1.2;
    color:var(--pta);
    font-weight:750;
    letter-spacing:.1px;
  }
  .sell-range-prominent .range-value .rs{
    font-size:11px;
    margin-right:2px;
    font-weight:700;
  }
  .piece-row .sell-range-prominent{
    margin-top:3px;
  }

  .card-actions{display:flex;gap:8px;margin-top:10px;}
  .card-actions button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:12.5px;}
  .card-actions button.sell-btn{color:var(--sale);border-color:var(--sale);}
  .card-actions button.del-btn{color:var(--danger);}

  .fab{position:fixed;bottom:calc(46px + env(safe-area-inset-bottom, 0px));right:50%;transform:translateX(230px);width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-text);border:none;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.4);z-index:20;}
  @media (max-width:520px){ .fab{transform:none;right:20px;} }

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
  .overlay.hidden{display:none;}
  .sheet{background:var(--surface);width:min(100%,480px);max-width:480px;min-width:0;border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;padding:16px 16px 20px;}
  .sheet-handle{width:36px;height:4px;background:var(--border-strong);border-radius:2px;margin:0 auto 12px;}
  .sheet h2{font-size:16px;margin:0 0 12px;}
  .sheet-item-name{font-size:14px;color:var(--text-dim);margin:-6px 0 14px;}
  .sec-label{font-size:11px;color:var(--text-dim);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-opt{padding:8px 13px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;color:var(--text-dim);}
  .chip-opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600;}
  .chip-opt.status-opt{flex:1 1 30%;text-align:center;font-size:12.5px;padding:10px 4px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;}
  .field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:14px;}
  .qty-warning{display:none;font-size:11px;color:var(--nonpta);margin-top:6px;line-height:1.4;}
  .qty-warning.show{display:block;}
  .model-input-row{display:flex;gap:8px;}
  .model-input-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:14px;}
  .model-input-row input:focus{outline:none;border-color:var(--accent);}
  .model-dropdown-btn{flex-shrink:0;width:40px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:14px;}
  .model-dropdown-btn.on{border-color:var(--accent);color:var(--accent);}
  .model-suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .model-suggestions:empty{margin-top:0;}
  .model-suggestion-chip{padding:6px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;color:var(--text-dim);user-select:none;-webkit-user-select:none;-moz-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  .model-suggestion-chip::selection{background:transparent;color:inherit;}
  .settings-category,.settings-toggle-chip,.settings-opt,.chip,.chip-opt,[role=button],.add-extra-buy,.add-expense-inline,.add-piece-btn{user-select:none;-webkit-user-select:none;-moz-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  .model-suggestion-chip.new-tag{color:var(--accent);border-color:var(--accent);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .big-input input{font-size:18px;padding:12px 10px;font-weight:600;}
  .profit-preview{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:12px 0;display:flex;justify-content:space-between;font-size:13px;}
  .extra-buy-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .extra-buy-row{display:flex;gap:8px;align-items:center;}
  .extra-buy-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:14px;}
  .extra-buy-row input:focus{outline:none;border-color:var(--accent);}
  .extra-buy-remove{flex-shrink:0;width:34px;height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--danger);font-size:16px;}
  .add-extra-buy{text-align:center;padding:9px;margin-top:8px;color:var(--accent);font-size:12.5px;font-weight:600;border:1px dashed var(--border-strong);border-radius:9px;}
  .add-piece-btn{display:block;width:100%;text-align:center;padding:9px;margin-top:8px;color:var(--accent);font-size:12px;font-weight:600;border:1px dashed var(--border-strong);border-radius:9px;background:transparent;}
  .price-hint{font-size:11px;color:var(--accent);margin-top:3px;min-height:14px;}
  .photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .photo-thumb-wrap{position:relative;width:64px;height:64px;flex-shrink:0;}
  .photo-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;}
  .photo-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .photo-add-btn{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:8px;border:1px dashed var(--border-strong);color:var(--accent);font-size:12px;text-align:center;cursor:pointer;flex-shrink:0;}
  .photo-add-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .crop-stage-wrap{display:flex;justify-content:center;margin-top:4px;}
  .crop-stage{position:relative;width:100%;max-width:400px;touch-action:none;background:#000;border-radius:12px;overflow:hidden;}
  .crop-stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}
  .crop-box{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,0.6);touch-action:none;}
  .crop-handle{position:absolute;width:24px;height:24px;background:var(--accent);border:2px solid var(--bg);border-radius:50%;transform:translate(-50%,-50%);touch-action:none;}
  .crop-handle.tl{top:0;left:0;}
  .crop-handle.tr{top:0;left:100%;}
  .crop-handle.bl{top:100%;left:0;}
  .crop-handle.br{top:100%;left:100%;}
  .crop-hint{text-align:center;font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.4;}
  .card-photo-strip{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .card-photo-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  .card-photo-count{font-size:11px;color:var(--text-dim);}
  .card-actions button.share-btn{color:var(--accent);border-color:var(--accent);}
  .extra-piece-block{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 10px 4px;margin-bottom:10px;}
  .extra-piece-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-dim);font-weight:600;margin-bottom:8px;}
  .extra-piece-block .field select{width:100%;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:13.5px;}
  .profit-preview .v{font-weight:600;}
  .more-toggle{text-align:center;padding:10px;color:var(--accent);font-size:13px;font-weight:600;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:10px 0;}
  .more-section{display:none;}
  .more-section.show{display:block;}
  .sheet-actions{display:flex;gap:10px;margin-top:14px;position:sticky;bottom:0;background:var(--surface);padding-top:6px;}
  .sheet-actions button{flex:1;padding:13px;border-radius:10px;font-size:14.5px;font-weight:600;border:none;}
  .btn-save{background:var(--accent);color:var(--accent-text);}
  .fab-expense{
    position:fixed; left:18px; bottom:calc(46px + env(safe-area-inset-bottom, 0px)); z-index:20;
    width:56px; height:56px; border-radius:50%;
    background:var(--danger); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; border:none; box-shadow:0 6px 16px rgba(0,0,0,.35);
    cursor:pointer; transition:transform .15s;
  }
  .fab-expense:active{ transform:scale(0.92); }
  .fab-expense-label{
    position:fixed; left:18px; bottom:calc(106px + env(safe-area-inset-bottom, 0px)); z-index:20;
    background:var(--surface-2); color:var(--text-dim); font-size:10.5px;
    padding:3px 8px; border-radius:8px; opacity:.85; pointer-events:none;
  }
  .btn-sale{background:var(--sale);color:#2a0e3d;}
  .btn-cancel{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .header-top h1{margin:0;}
  .menu-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;}
  .menu-btn:active{border-color:var(--accent);color:var(--accent);}
  .menu-dropdown{position:absolute;top:52px;right:14px;left:14px;max-width:340px;margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.25);padding:8px;z-index:50;max-height:75vh;overflow-y:auto;}
  .menu-dropdown.hidden{display:none;}
  .menu-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:10px 10px 4px;}
  .menu-section-label:first-child{padding-top:4px;}
  .menu-item{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:10px;border-radius:8px;font-size:14px;}
  .menu-item:active{background:var(--bg);}
  .menu-item.danger{color:var(--danger);}
  .menu-divider{height:1px;background:var(--border);margin:6px 4px;}
  .backup-reminder{display:none;align-items:center;justify-content:space-between;gap:8px;background:var(--nonpta-bg);border:1px solid var(--nonpta);color:var(--nonpta);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:12.5px;}
  .backup-reminder.show{display:flex;}
  .backup-reminder button{flex-shrink:0;background:var(--nonpta);color:#2a2213;border:none;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:600;}
  .backup-reminder .dismiss{background:transparent;color:var(--nonpta);border:1px solid var(--nonpta);margin-left:4px;font-weight:400;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong);border-radius:10px;padding:10px 16px;font-size:12.5px;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast.undo-toast{display:flex;align-items:center;gap:12px;text-align:left;}
  .toast.undo-toast #undoToastBtn{flex-shrink:0;background:var(--accent);color:var(--accent-text);border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;}
  .storage-bar-wrap{margin-top:10px;}
  .storage-bar-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
  .storage-bar-fill{height:100%;width:0%;background:var(--pta);transition:width .3s;}
  .storage-bar-label{font-size:10.5px;color:var(--text-dim);margin-top:4px;text-align:right;}
  .save-error-banner{display:none;background:var(--cpid-bg);border:1px solid var(--cpid);color:var(--cpid);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.5;}
  .save-error-banner.show{display:block;}

  .stat-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .stat-card{background:var(--surface);border-radius:var(--radius);padding:14px 12px;}
  .stat-card .v{font-size:20px;font-weight:700;}
  .stat-card .l{font-size:11.5px;color:var(--text-dim);margin-top:4px;}
  .report-filters{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .report-summary{background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;}
  .report-summary .v{font-size:18px;font-weight:700;color:var(--pta);}
  .report-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
  .report-row{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:12.5px;}
  .report-row .rr-top{display:flex;justify-content:space-between;font-weight:600;}
  .report-row .rr-sub{color:var(--text-dim);margin-top:3px;}
  .report-row .rr-profit{font-weight:600;}
  .contact-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;margin-top:10px;}
  .contact-list{margin-top:12px;display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;}
  .contact-card{background:var(--surface);border-radius:var(--radius);padding:12px 14px;}
  .contact-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .contact-name{font-size:14.5px;font-weight:700;}
  .contact-number{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .contact-badges{display:flex;gap:6px;flex-shrink:0;}
  .contact-tx-list{margin-top:10px;p
